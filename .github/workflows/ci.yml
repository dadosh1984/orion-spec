name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Core coverage gate (track.ts, scale.ts, tddCore.ts)
        run: pnpm run core:coverage

      - name: CHANGELOG/version sync gate
        run: node scripts/check-changelog.mjs

      - name: Prune cache after build
        run: node dist/cli/index.js track prune

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/
            orion-report.json

      - name: Build Docker image (sandboxed CI, linux only)
        if: matrix.os == 'ubuntu-latest'
        run: docker build -t orion:0.4 .
