name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  # npm publish --provenance (v0.23) needs an OIDC id-token so npm can mint
  # a signed provenance attestation for the published tarball.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          # Publish only strict version tags that match package.json; the
          # step still exits 0 (not skipped) so the release job still runs.
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "${TAG}" != "v${PKG_VERSION}" ]; then
            echo "::notice::tag ${TAG} does not match package version v${PKG_VERSION} — skipping publish"
            exit 0
          fi
          # A version may already be on npm (published earlier out-of-band).
          # Re-publishing fails with E403 and would block the GH release,
          # so treat that case as an idempotent no-op (exit 0). The GitHub
          # Release job still runs because we never fail on a dup version.
          if npm view "orion-spec@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::orion-spec@${PKG_VERSION} already on npm — skipping publish"
            exit 0
          fi
          npm publish --provenance

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::release ${TAG} already exists — skipping"
            exit 0
          fi
          # Mark "latest" only for a strict semver tag (vX.Y.Z) that is the
          # newest; suffixed/backported tags must never steal the Latest badge.
          LATEST_TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && \
             { [ -z "${LATEST_TAG}" ] || [ "${TAG}" = "$(printf '%s\n%s' "${LATEST_TAG}" "${TAG}" | sort -V | tail -n 1)" ]; }; then
            LATEST_FLAG="--latest"
          else
            LATEST_FLAG="--latest=false"
          fi
          gh release create "${TAG}" --title "${TAG}" --generate-notes ${LATEST_FLAG}
