name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::release ${TAG} already exists — skipping"
            exit 0
          fi
          # Mark "latest" only when this tag is the newest semver; a
          # backported tag pushed later must not steal the Latest badge.
          LATEST_TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "${LATEST_TAG}" ] || [ "${TAG}" = "$(printf '%s\n%s' "${LATEST_TAG}" "${TAG}" | sort -V | tail -n 1)" ]; then
            LATEST_FLAG="--latest"
          else
            LATEST_FLAG="--latest=false"
          fi
          gh release create "${TAG}" --title "${TAG}" --generate-notes ${LATEST_FLAG}
